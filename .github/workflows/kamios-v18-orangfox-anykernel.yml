name: Package Kamios V18 BakaSU for OrangeFox

on:
  push:
    branches:
      - experiment/kamios-v18-in-tree-bakasu
    paths:
      - .github/workflows/kamios-v18-orangfox-anykernel.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download completed and ABI-tested kernel Image
        uses: actions/download-artifact@v4
        with:
          name: kamios-v18-bakasu-uapi6-susfs-full-image-ABI-UNVERIFIED
          run-id: 41192072295
          github-token: ${{ github.token }}
          path: input
      - name: Verify the pinned Image and module symbols
        shell: bash
        run: |
          set -euo pipefail
          echo 'a7553b02b86928f28e95fb396de15de4f8ee29f3e055389aa56d4aedb7cf0fdd  input/Image' | sha256sum -c -
          echo '11567abf02997de71fb49b2a434087d70823ab089dfd99209e9843f5d326c776  input/Module.symvers' | sha256sum -c -
          grep -qx '6.1.176-Vibranium-V18+' input/kernelrelease.txt
      - name: Pin verified AnyKernel3 installer
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/osm0sis/AnyKernel3.git ak3
          git -C ak3 checkout -q --detach 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          test "$(git -C ak3 rev-parse HEAD)" = 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          test -s ak3/tools/ak3-core.sh
          test -s ak3/META-INF/com/google/android/update-binary
      - name: Configure only active peridot boot kernel replacement
        shell: bash
        run: |
          set -euo pipefail
          cat > ak3/anykernel.sh <<'EOF'
          #!/sbin/sh
          # AnyKernel3 target: peridot on Kamios 1.1 Android 17.
          properties() { '
          kernel.string=BakaSU UAPI6 + SUSFS + WildKernels Kamios V18
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=peridot
          device.name2=peridot_global
          device.name3=
          supported.versions=17
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          SLOT_SELECT=active;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          NO_VBMETA_PARTITION_PATCH=1;
          . tools/ak3-core.sh;
          # Kamios boot v4 has no boot ramdisk; retain all other components.
          split_boot;
          flash_boot;
          EOF
          cp input/Image ak3/Image
          chmod 755 ak3/anykernel.sh
          cat > ak3/READ-ME-KAMIOS-V18.txt <<'EOF'
          POCO F6 peridot | Kamios v1.1 Android 17 | Vibranium V18
          Compiled: BakaSU UAPI6 + SUSFS + selected WildKernels (NTSync,
          Unicode and ARM64 prefetch). Full stock module symbol CRC match.
          Kernel Image SHA256:
          a7553b02b86928f28e95fb396de15de4f8ee29f3e055389aa56d4aedb7cf0fdd
          This is a recovery flash ZIP, but FIRST DEVICE BOOT IS NOT TESTED.
          Preserves other boot sections, active slot boot partition only.
          Does not write inactive slot, init_boot, vendor_boot, or userdata.
          Retain the stock Kamios original boot.img to recover from boot failure.
          No cryptographic ZIP signature: use unsigned custom ZIP installation.
          Stop if your ROM is not Kamios 1.1 Vibranium V18.
          EOF
      - name: Build and validate recovery ZIP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip unzip
          mkdir -p dist
          rm -rf ak3/.git ak3/.github
          cd ak3
          zip -q -r -9 ../dist/Kamios-V18-Peridot-BakaSU-UAPI6-SUSFS-WildKernels-OrangeFox-UNTESTED.zip anykernel.sh Image READ-ME-KAMIOS-V18.txt tools META-INF
          cd ..
          unzip -t dist/*.zip | tail -3
          unzip -Z1 dist/*.zip | grep -qx 'META-INF/com/google/android/update-binary'
          unzip -Z1 dist/*.zip | grep -qx 'META-INF/com/google/android/updater-script'
          unzip -Z1 dist/*.zip | grep -qx 'Image'
          unzip -p dist/*.zip Image | sha256sum -c <(printf '%s\n' 'a7553b02b86928f28e95fb396de15de4f8ee29f3e055389aa56d4aedb7cf0fdd  -')
          unzip -p dist/*.zip anykernel.sh | grep -Fxq 'IS_SLOT_DEVICE=1;'
          unzip -p dist/*.zip anykernel.sh | grep -Fxq 'SLOT_SELECT=active;'
          sha256sum dist/*.zip
          ls -lh dist/*.zip
      - name: Upload OrangeFox ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kamios-V18-Peridot-BakaSU-SUSFS-WildKernels-OrangeFox-UNTESTED
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
