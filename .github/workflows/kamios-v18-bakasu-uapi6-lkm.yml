name: Kamios V18 BakaSU UAPI6 LKM qualification

on:
  push:
    branches: [experiment/kamios-v18-bakasu-uapi6-lkm]
    paths:
      - '.github/workflows/kamios-v18-bakasu-uapi6-lkm.yml'
      - 'configs/kamios-v1.1-20261027-vibranium-v18.config'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      KERNEL_COMMIT: 4b42813174f309838106763126c8d3c8f14e96b2
      BAKASU_COMMIT: 5785bdb8091304322f597f67d50e0b79f9815cb2
      TARGET_RELEASE: 6.1.176-Vibranium-V18+
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison flex make git python3 libssl-dev libelf-dev dwarves cpio xz-utils zstd curl libncurses-dev
          df -h .
      - name: Pin Android Clang 21 used by Kamios
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/clang.tar.gz \
            https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz
          echo '57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  /tmp/clang.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/clang"
          tar -xf /tmp/clang.tar.gz -C "$RUNNER_TEMP/clang"
          CLANG_DIR="$(find "$RUNNER_TEMP/clang" -type f -path '*/bin/clang' -printf '%h\n' | head -1)"
          test -x "$CLANG_DIR/clang"
          echo "$CLANG_DIR" >> "$GITHUB_PATH"
          rm /tmp/clang.tar.gz
      - name: Fetch pinned kernel and BakaSU trees
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch 17 https://github.com/khargosxh18/android_kernel_xiaomi_sm8635.git kernel-src
          test "$(git -C kernel-src rev-parse HEAD)" = "$KERNEL_COMMIT"
          git clone --depth 1 https://github.com/Baka-SU/BakaSU.git BakaSU
          git -C BakaSU fetch --depth 1 origin "$BAKASU_COMMIT"
          git -C BakaSU checkout --detach "$BAKASU_COMMIT"
          grep -q 'KERNEL_SU_UAPI_VERSION = 6' BakaSU/uapi/supercall.h
          grep -q '^VERSION = 6$' kernel-src/Makefile
          grep -q '^SUBLEVEL = 176$' kernel-src/Makefile
          df -h .
      - name: Fix pinned Vibranium PKCS11 key_pass compilation
        shell: bash
        run: |
          set -euo pipefail
          # This source revision declares key_pass only under USE_PKCS11_ENGINE,
          # but the PKCS11 branch references it unconditionally. Keep the
          # PKCS11 PIN behavior intact when the engine option is enabled.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel-src/certs/extract-cert.c")
          source = p.read_text()
          before = (
              '\t\tif (key_pass)\n'
              '\t\t\tERR(!ENGINE_ctrl_cmd_string(e, "PIN", key_pass, 0), "Set PKCS#11 PIN");'
          )
          after = '#ifdef USE_PKCS11_ENGINE\n' + before + '\n#endif'
          if source.count(before) != 1 or '#ifdef USE_PKCS11_ENGINE\n' + before in source:
              raise SystemExit('Unexpected upstream PKCS11 code; refusing to apply patch')
          p.write_text(source.replace(before, after, 1))
          assert p.read_text().count(after) == 1
          print("Patched certs/extract-cert.c with matching PKCS11 PIN guard")
          PY
          git -C kernel-src diff --check
          git -C kernel-src diff -- certs/extract-cert.c
      - name: Prepare kernel configuration and preserve ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel-out
          cp configs/kamios-v1.1-20261027-vibranium-v18.config kernel-out/.config
          echo '4d77d949c21ecbd14d64286c51476fae6091cfa7ed89b1642db18b8eae7258db  kernel-out/.config' | sha256sum -c -
          sed -i -e 's/^CONFIG_IKCONFIG_PROC=y$/# CONFIG_IKCONFIG_PROC is not set/' kernel-out/.config
          make -C kernel-src O="$GITHUB_WORKSPACE/kernel-out" ARCH=arm64 LLVM=1 olddefconfig
          test "$(grep '^CONFIG_LOCALVERSION=' kernel-out/.config)" = 'CONFIG_LOCALVERSION="-Vibranium-V18"'
          make -C kernel-src O="$GITHUB_WORKSPACE/kernel-out" ARCH=arm64 LLVM=1 -s kernelrelease | tee kernelrelease.txt
          test "$(cat kernelrelease.txt)" = "$TARGET_RELEASE"
      - name: Compile kernel symbol database using matching configuration
        shell: bash
        run: |
          set -euo pipefail
          make -C kernel-src O="$GITHUB_WORKSPACE/kernel-out" ARCH=arm64 LLVM=1 -j2 Image modules
          test -s kernel-out/Module.symvers
          test -s kernel-out/vmlinux
      - name: Compile BakaSU UAPI6 external LKM
        shell: bash
        run: |
          set -euo pipefail
          make -C kernel-src O="$GITHUB_WORKSPACE/kernel-out" M="$GITHUB_WORKSPACE/BakaSU/kernel" \
            ARCH=arm64 LLVM=1 CONFIG_KSU=m CONFIG_KSU_TRACEPOINT_HOOK=y \
            CONFIG_KSU_MULTI_MANAGER_SUPPORT=y -j2 modules
          test -s BakaSU/kernel/kernelsu.ko
          test "$(llvm-readelf -h BakaSU/kernel/kernelsu.ko | grep 'Machine:')" != ""
          llvm-modinfo BakaSU/kernel/kernelsu.ko 2>/dev/null || true
      - name: Validate LKM without installing it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          module=Path("BakaSU/kernel/kernelsu.ko")
          assert module.is_file() and module.stat().st_size > 10000
          x=subprocess.check_output(["strings", str(module)],text=True)
          expected="6.1.176-Vibranium-V18+"
          if expected not in x:
              raise SystemExit("FAIL: vermagic differs from running Kamios "+expected)
          if "vermagic=" not in x:
              raise SystemExit("FAIL: module vermagic missing")
          print("PASS: candidate module includes exact kernel release; runtime symbol CRC compatibility still requires independent validation")
          PY
          sha256sum BakaSU/kernel/kernelsu.ko
          printf 'Experimental LKM only; NOT qualified for flash or automatic install.\n' > VALIDATION.txt
      - name: Upload offline evaluation candidate
        uses: actions/upload-artifact@v4
        with:
          name: kamios-v18-bakasu-uapi6-lkm-UNVERIFIED
          path: |
            BakaSU/kernel/kernelsu.ko
            VALIDATION.txt
            kernelrelease.txt
          if-no-files-found: error
          retention-days: 14
